<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Art Patnam — Arte para espacios profesionales</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">
  <div class="logo">ART PATNAM</div>

  <nav class="nav-menu">
    <a data-section="home">Inicio</a>
    <a data-section="fineart">Arte</a>
    <a data-section="contact">Contacto</a>
  </nav>

  <div class="lang-switch">
    <button class="lang active" data-lang="es">ES</button>
    <button class="lang" data-lang="en">EN</button>
  </div>
</header>

<main>

<!-- HERO -->
<section id="home" class="section active hero">
  <div class="hero-grid">

    <div class="hero-copy">
      <span class="eyebrow"
        data-es="Arte contemporáneo para negocios"
        data-en="Contemporary art for business spaces"></span>

      <h1
        data-es="Arte que transforma espacios profesionales"
        data-en="Art that transforms professional spaces"></h1>

      <p class="lead"
        data-es="Seleccionamos y alquilamos obras de arte que elevan la identidad de restaurantes, hoteles y espacios de bienestar."
        data-en="We curate and rent artworks that elevate the identity of restaurants, hotels and wellness spaces."></p>

      <p class="secondary"
        data-es="Cada proyecto se diseña para generar emoción, coherencia estética y valor de marca."
        data-en="Each project is designed to create emotion, aesthetic coherence and brand value."></p>
    </div>

    <div class="hero-image">
      <img src="img/anti-ism.jpg" alt="">
    </div>

  </div>
</section>

<!-- ARTE -->
<section id="fineart" class="section">

  <header class="section-header">
    <h2
      data-es="Obras seleccionadas para cada tipo de espacio"
      data-en="Curated artworks for every type of space"></h2>
  </header>

  <div class="filters">
    <button class="filter active" data-filter="all" data-es="Todos" data-en="All">Todos</button>
    <button class="filter" data-filter="restaurant" data-es="Restaurantes" data-en="Restaurants">Restaurantes</button>
    <button class="filter" data-filter="hotel" data-es="Hoteles" data-en="Hotels">Hoteles</button>
    <button class="filter" data-filter="wellness" data-es="Wellness" data-en="Wellness">Wellness</button>
    <button class="filter" data-filter="clinic" data-es="Clínicas" data-en="Clinics">Clínicas</button>
  </div>

  <div class="gallery">

    <article class="artwork" data-category="restaurant hotel">
      <img src="img/anti-ism.jpg" alt="">
      <h3>Anti‑ism</h3>
      <p data-es="Presencia fuerte para espacios gastronómicos y hoteleros."
         data-en="Strong presence for hospitality spaces."></p>
    </article>

    <article class="artwork" data-category="wellness office">
      <img src="img/silver-eruption.jpg" alt="">
      <h3>Silver Eruption</h3>
      <p data-es="Elegancia calmada para bienestar y trabajo."
         data-en="Calm elegance for wellness and workspaces."></p>
    </article>

    <article class="artwork" data-category="hotel healthcare">
      <img src="img/paisaje.jpg" alt="">
      <h3>Paisaje</h3>
      <p data-es="Ambientes acogedores y humanos."
         data-en="Warm and human environments."></p>
    </article>

    <article class="artwork" data-category="clinic healthcare">
      <img src="img/paisaje-abstracto.jpg" alt="">
      <h3>Paisaje abstracto</h3>
      <p data-es="Equilibrio visual para espacios clínicos."
         data-en="Visual balance for clinical spaces."></p>
    </article>

    <article class="artwork" data-category="hotel wellness">
      <img src="img/i-journey.jpg" alt="">
      <h3>I Journey</h3>
      <p data-es="Arte para experiencias premium."
         data-en="Art for premium experiences."></p>
    </article>

  </div>
</section>

<!-- CONTACTO -->
<section id="contact" class="section contact">

  <div class="contact-grid">

    <div class="contact-copy">
      <span class="eyebrow"
        data-es="Contacto profesional"
        data-en="Professional contact"></span>

      <h2
        data-es="Cuéntanos tu espacio"
        data-en="Tell us about your space"></h2>

      <p
        data-es="Estudiamos cada proyecto de forma personalizada para recomendar obras alineadas con tu negocio."
        data-en="We study each project individually to recommend artworks aligned with your business."></p>
    </div>

    <form class="contact-form"
      action="https://formspree.io/f/mnjnvbky"
      method="POST">

      <input type="text" name="name" placeholder="Nombre" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="tel" name="phone" placeholder="Teléfono">
      <textarea name="space" rows="4" placeholder="Describe tu espacio"></textarea>
      <button type="submit"
        data-es="Enviar consulta"
        data-en="Send enquiry"></button>

    </form>

  </div>
</section>

</main>

<script>
/* Navegación */
document.querySelectorAll('.nav-menu a').forEach(link => {
  link.onclick = () => {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(link.dataset.section).classList.add('active');
    window.scrollTo(0,0);
  };
});

/* Idiomas */
function setLanguage(lang) {
  document.querySelectorAll('[data-es]').forEach(el => {
    el.textContent = el.dataset[lang];
  });
}
document.querySelectorAll('.lang').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.lang').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setLanguage(btn.dataset.lang);
  };
});
setLanguage('es');

/* Filtros */
document.querySelectorAll('.filter').forEach(f => {
  f.onclick = () => {
    document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
    f.classList.add('active');
    const filter = f.dataset.filter;
    document.querySelectorAll('.artwork').forEach(a => {
      a.style.display =
        filter === 'all' || a.dataset.category.includes(filter)
        ? 'block' : 'none';
    });
  };
});
</script>

</body>
</html>

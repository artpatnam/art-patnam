<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Art Patnam | Art for Business Spaces</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- LANGUAGE SELECTOR -->
<div id="language-modal" class="language-modal">
  <div class="language-box">
    <p>Select your language</p>
    <button data-lang="en">English</button>
    <button data-lang="es">Español</button>
  </div>
</div>

<header>
  <div class="logo">ART PATNAM</div>
  <button class="menu-toggle">☰</button>

  <nav class="nav-menu">
    <a data-section="home" data-en="Home" data-es="Inicio">Home</a>
    <a data-section="fineart" data-en="Fine Art" data-es="Arte">Fine Art</a>
    <a data-section="contact" data-en="Contact" data-es="Contacto">Contact</a>
  </nav>
</header>

<!-- HOME -->
<section id="home" class="section active hero">
  <div class="hero-inner">
    <div class="hero-text">
      <h1
        data-en="Art that elevates your business space"
        data-es="Arte que eleva la imagen de tu negocio">
      </h1>

      <p
        data-en="We help restaurants, clinics, salons and small businesses create beautiful, professional interiors through carefully curated fine art."
        data-es="Ayudamos a restaurantes, clínicas, salones y pequeños negocios a crear espacios atractivos y profesionales mediante arte cuidadosamente seleccionado.">
      </p>
    </div>

    <div class="hero-images">
      <div class="hero-image">Image</div>
      <div class="hero-image">Image</div>
    </div>
  </div>
</section>

<!-- FINE ART -->
<section id="fineart" class="section">
  <h2 data-en="Fine Art for Business Spaces" data-es="Arte para espacios comerciales"></h2>

  <p class="section-desc"
     data-en="Our collection is curated to enhance commercial environments, helping businesses create welcoming, distinctive and memorable spaces."
     data-es="Nuestra colección está pensada para mejorar espacios comerciales, ayudando a los negocios a crear ambientes acogedores, diferenciadores y memorables.">
  </p>

  <!-- FILTER -->
  <div class="filters">
    <button class="filter active" data-filter="all"
      data-en="All spaces" data-es="Todos">All spaces</button>
    <button class="filter" data-filter="restaurant"
      data-en="Restaurants" data-es="Restaurantes">Restaurants</button>
    <button class="filter" data-filter="wellness"
      data-en="Wellness & Beauty" data-es="Wellness y Belleza">Wellness</button>
    <button class="filter" data-filter="clinic"
      data-en="Clinics" data-es="Clínicas">Clinics</button>
    <button class="filter" data-filter="office"
      data-en="Offices" data-es="Oficinas">Offices</button>
  </div>

  <!-- GALLERY -->
  <div class="gallery">

    <article class="artwork" data-space="restaurant office">
      <div class="art-image">Artwork</div>
      <h3>Anti-ism</h3>
      <span class="use"
        data-en="Recommended for restaurants & reception areas"
        data-es="Recomendado para restaurantes y recepciones">
      </span>
      <p
        data-en="A bold yet balanced piece that adds personality and sophistication to dining spaces."
        data-es="Una obra con carácter que aporta personalidad y sofisticación a espacios de restauración.">
      </p>
    </article>

    <article class="artwork" data-space="wellness clinic">
      <div class="art-image">Artwork</div>
      <h3>Silver Eruption</h3>
      <span class="use"
        data-en="Ideal for wellness and calm environments"
        data-es="Ideal para entornos de bienestar y calma">
      </span>
      <p
        data-en="Perfect for creating a serene and elegant atmosphere in wellness spaces."
        data-es="Perfecta para crear una atmósfera serena y elegante en espacios de bienestar.">
      </p>
    </article>

    <article class="artwork" data-space="clinic office">
      <div class="art-image">Artwork</div>
      <h3>Untitled</h3>
      <span class="use"
        data-en="Suitable for clinics and professional offices"
        data-es="Adecuado para clínicas y oficinas profesionales">
      </span>
      <p
        data-en="Clean and balanced composition that reinforces trust and professionalism."
        data-es="Composición limpia y equilibrada que refuerza confianza y profesionalidad.">
      </p>
    </article>

  </div>
</section>

<!-- CONTACT -->
<section id="contact" class="section contact">
  <h2 data-en="Contact us" data-es="Contacto"></h2>
  <p data-en="Tell us about your space and project"
     data-es="Cuéntanos cómo es tu espacio y tu proyecto">
  </p>

  <form action="https://formspree.io/f/mnjnvbky" method="POST">
    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="message" placeholder="Project details"></textarea>
    <button type="submit"
      data-en="Send message"
      data-es="Enviar mensaje">
    </button>
  </form>
</section>

<footer class="visually-hidden">© 2026 Art Patnam</footer>

<script>
/* LANGUAGE */
const modal = document.getElementById('language-modal');
const langSaved = localStorage.getItem('lang');

if (langSaved) {
  modal.style.display = 'none';
  setLanguage(langSaved);
}

document.querySelectorAll('[data-lang]').forEach(btn => {
  btn.onclick = () => {
    localStorage.setItem('lang', btn.dataset.lang);
    modal.style.display = 'none';
    setLanguage(btn.dataset.lang);
  };
});

function setLanguage(lang) {
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = el.dataset[lang];
  });
}

/* NAV */
document.querySelectorAll('.nav-menu a').forEach(link => {
  link.onclick = () => {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(link.dataset.section).classList.add('active');
  };
});

/* FILTER */
document.querySelectorAll('.filter').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const filter = btn.dataset.filter;
    document.querySelectorAll('.artwork').forEach(art => {
      art.style.display =
        filter === 'all' || art.dataset.space.includes(filter)
        ? 'block' : 'none';
    });
  };
});
</script>

</body>
</html>
``

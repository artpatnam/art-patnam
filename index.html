<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Art Patnam | Art for Business Spaces</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- GOOGLE FONTS (CORREGIDO) -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap">

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- =========================
LANGUAGE SELECTOR
========================= -->
<div id="language-modal" class="language-modal">
  <div class="language-box">
    <p>Select your language</p>
    <button data-lang="en">English</button>
    <button data-lang="es">Español</button>
  </div>
</div>

<!-- =========================
HEADER
========================= -->
<header>
  <div class="logo">ART PATNAM</div>

  <button class="menu-toggle" aria-label="Menu">☰</button>

  <nav class="nav-menu">
    <a data-section="home" data-en="Home" data-es="Inicio">Home</a>
    <a data-section="fineart" data-en="Fine Art" data-es="Arte">Fine Art</a>
    <a data-section="contact" data-en="Contact" data-es="Contacto">Contact</a>
  </nav>
</header>

<!-- =========================
HOME
========================= -->
<section id="home" class="section hero active">
  <div class="hero-inner">

    <div class="hero-text">
      <h1
        data-en="Art that elevates your business space"
        data-es="Arte que eleva la imagen de tu negocio">
      </h1>

      <p
        data-en="We help restaurants, clinics, offices and wellness businesses create attractive, professional interiors through carefully curated fine art."
        data-es="Ayudamos a restaurantes, clínicas, oficinas y negocios de bienestar a crear espacios atractivos y profesionales mediante arte cuidadosamente seleccionado.">
      </p>
    </div>

    <div class="hero-images">
      <div class="hero-image">
        <img src="images/hero-1.jpg" alt="Art in business space">
      </div>
      <div class="hero-image">
        <img src="images/hero-2.jpg" alt="Art for commercial interiors">
      </div>
    </div>

  </div>
</section>

<!-- =========================
FINE ART
========================= -->
<section id="fineart" class="section">

  <h2
    data-en="Fine Art for Business Spaces"
    data-es="Arte para espacios comerciales">
  </h2>

  <p class="section-desc"
     data-en="A curated selection of artworks designed to enhance restaurants, offices, clinics and wellness spaces."
     data-es="Una selección de obras pensadas para mejorar restaurantes, oficinas, clínicas y espacios de bienestar.">
  </p>

  <!-- FILTERS -->
  <div class="filters">
    <button class="filter active" data-filter="all"
      data-en="All spaces" data-es="Todos">All spaces</button>
    <button class="filter" data-filter="restaurant"
      data-en="Restaurants" data-es="Restaurantes">Restaurants</button>
    <button class="filter" data-filter="office"
      data-en="Offices" data-es="Oficinas">Offices</button>
    <button class="filter" data-filter="clinic"
      data-en="Clinics" data-es="Clínicas">Clinics</button>
    <button class="filter" data-filter="wellness"
      data-en="Wellness & Beauty" data-es="Wellness y Belleza">Wellness</button>
  </div>

  <!-- GALLERY -->
  <div class="gallery">

    <!-- 1. ANTI-ISM -->
    <article class="artwork" data-space="restaurant office">
      <div class="art-image">
        <img src="images/anti-ism.jpg" alt="Anti-ism artwork">
      </div>
      <h3>Anti-ism</h3>
      <span class="use"
        data-en="Recommended for restaurants and offices"
        data-es="Recomendado para restaurantes y oficinas">
      </span>
      <p
        data-en="A contemporary artwork with strong visual presence, ideal for adding character and identity to dining areas and professional workspaces."
        data-es="Una obra contemporánea con gran presencia visual, ideal para aportar carácter e identidad tanto en espacios de restauración como en entornos profesionales.">
      </p>
    </article>

    <!-- 2. SILVER ERUPTION -->
    <article class="artwork" data-space="office wellness">
      <div class="art-image">
        <img src="images/silver-eruption.jpg" alt="Silver Eruption artwork">
      </div>
      <h3>Silver Eruption</h3>
      <span class="use"
        data-en="Ideal for offices, wellness and beauty spaces"
        data-es="Ideal para oficinas y espacios de wellness y belleza">
      </span>
      <p
        data-en="An elegant and balanced piece that brings calm, sophistication and a modern feel to professional and wellness environments."
        data-es="Una obra elegante y equilibrada que aporta calma, sofisticación y un aire moderno a entornos profesionales y de bienestar.">
      </p>
    </article>

    <!-- 3. PAISAJE 1 -->
    <article class="artwork" data-space="restaurant office">
      <div class="art-image">
        <img src="images/paisaje-1.jpg" alt="Paisaje 1 artwork">
      </div>
      <h3>Paisaje 1</h3>
      <span class="use"
        data-en="Recommended for restaurants and offices"
        data-es="Recomendado para restaurantes y oficinas">
      </span>
      <p
        data-en="A warm and welcoming landscape that helps create a relaxed and pleasant atmosphere in restaurants and workspaces."
        data-es="Un paisaje cálido y acogedor que ayuda a crear una atmósfera agradable y relajada en restaurantes y oficinas.">
      </p>
    </article>

    <!-- 4. PAISAJE ABSTRACTO -->
    <article class="artwork" data-space="clinic office restaurant wellness">
      <div class="art-image">
        <img src="images/paisaje-abstracto.jpg" alt="Paisaje abstracto artwork">
      </div>
      <h3>Paisaje abstracto</h3>
      <span class="use"
        data-en="Suitable for clinics, offices, restaurants and wellness spaces"
        data-es="Adecuado para clínicas, oficinas, restaurantes y espacios de bienestar">
      </span>
      <p
        data-en="A versatile abstract artwork that adapts easily to different environments, bringing balance and visual harmony."
        data-es="Una obra abstracta muy versátil que se adapta fácilmente a distintos entornos, aportando equilibrio y armonía visual.">
      </p>
    </article>

    <!-- 5. I JOURNEY -->
    <article class="artwork" data-space="restaurant office clinic wellness">
      <div class="art-image">
        <img src="images/i-journey.jpg" alt="I Journey artwork">
      </div>
      <h3>I Journey</h3>
      <span class="use"
        data-en="Suitable for all types of commercial spaces"
        data-es="Adecuado para todo tipo de espacios comerciales">
      </span>
      <p
        data-en="A universal artwork designed to work across all business environments, enhancing atmosphere and reinforcing brand identity."
        data-es="Una obra universal pensada para funcionar en cualquier entorno comercial, mejorando la atmósfera y reforzando la identidad del negocio.">
      </p>
    </article>

  </div>
</section>

<!-- =========================
CONTACT
========================= -->
<section id="contact" class="section contact">
  <h2 data-en="Contact us" data-es="Contacto"></h2>

  <p
    data-en="Tell us about your space and we will help you choose the right artwork."
    data-es="Cuéntanos cómo es tu espacio y te ayudaremos a elegir la obra adecuada.">
  </p>

  <form action="https://formspree.io/f/mnjnvbky" method="POST">
    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="message" placeholder="Project details"></textarea>
    <button type="submit"
      data-en="Send message"
      data-es="Enviar mensaje">
    </button>
  </form>
</section>

<footer class="visually-hidden">© 2026 Art Patnam</footer>

<!-- =========================
SCRIPTS
========================= -->
<script>
/* LANGUAGE */
const modal = document.getElementById('language-modal');

if (localStorage.getItem('lang')) {
  modal.style.display = 'none';
  setLanguage(localStorage.getItem('lang'));
}

document.querySelectorAll('[data-lang]').forEach(btn => {
  btn.addEventListener('click', () => {
    localStorage.setItem('lang', btn.dataset.lang);
    modal.style.display = 'none';
    setLanguage(btn.dataset.lang);
  });
});

function setLanguage(lang) {
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = el.dataset[lang];
  });
}

/* MENU */
const menuToggle = document.querySelector('.menu-toggle');
const navMenu = document.querySelector('.nav-menu');

menuToggle.addEventListener('click', () => {
  navMenu.classList.toggle('open');
});

/* NAVIGATION */
document.querySelectorAll('.nav-menu a').forEach(link => {
  link.addEventListener('click', () => {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(link.dataset.section).classList.add('active');
    navMenu.classList.remove('open');
  });
});

/* FILTERS */
document.querySelectorAll('.filter').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const filter = btn.dataset.filter;
    document.querySelectorAll('.artwork').forEach(art => {
      art.style.display =
        filter === 'all' || art.dataset.space.includes(filter)
        ? 'block'
        : 'none';
    });
  });
});
</script>

</body>
</html>

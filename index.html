<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Art Patnam | Arte para negocios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- GOOGLE FONTS -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="logo">ART PATNAM</div>

  <nav class="nav-menu">
    <a data-section="home">Inicio</a>
    <a data-section="fineart">Arte</a>
    <a data-section="contact">Contacto</a>
  </nav>

  <div class="lang-switch">
    <button class="lang active" data-lang="es">ES</button>
    <button class="lang" data-lang="en">EN</button>
  </div>
</header>

<!-- =========================
HOME
========================= -->
<section id="home" class="section active hero">

  <!-- HERO NARRATIVO -->
  <div class="hero-inner">

    <div class="hero-text hero-text-elegant">

      <span class="hero-eyebrow"
        data-es="Arte contemporáneo para espacios profesionales"
        data-en="Contemporary art for professional spaces"></span>

      <h1
        data-es="Arte que define la experiencia de un espacio"
        data-en="Art that defines the experience of a space"></h1>

      <p class="hero-lead"
        data-es="Seleccionamos y alquilamos obras de arte para negocios que entienden el valor del detalle, la identidad y la experiencia del cliente."
        data-en="We curate and rent artworks for businesses that understand the value of detail, identity and customer experience."></p>

      <p class="hero-secondary"
        data-es="Trabajamos con restaurantes, hoteles, clínicas y espacios de bienestar que buscan diferenciarse de forma elegante y coherente."
        data-en="We work with restaurants, hotels, clinics and wellness spaces seeking elegant and coherent differentiation."></p>

    </div>

    <div class="hero-slider">
      <img src="img/anti-ism.jpg" class="active" alt="">
      <img src="img/silver-eruption.jpg" alt="">
      <img src="img/paisaje.jpg" alt="">
      <img src="img/paisaje-abstracto.jpg" alt="">
      <img src="img/i-journey.jpg" alt="">
    </div>

  </div>

  <!-- PRINCIPIO CLAVE (INTEGRADO) -->
  <div class="principle">
    <p
      data-es="Qué es, para quién es, qué aporta y por qué confiar. Todo empieza con una buena selección."
      data-en="What it is, who it is for, what it brings and why to trust. Everything starts with a good selection."></p>
  </div>

  <!-- CÓMO TRABAJAMOS -->
  <div class="how-we-work">

    <h2
      data-es="Cómo trabajamos"
      data-en="How we work"></h2>

    <div class="steps">

      <div class="step">
        <span>01</span>
        <h3
          data-es="Analizamos tu espacio"
          data-en="We analyse your space"></h3>
        <p
          data-es="Entendemos el tipo de negocio, el entorno y la experiencia que deseas ofrecer."
          data-en="We understand the business type, environment and experience you want to offer."></p>
      </div>

      <div class="step">
        <span>02</span>
        <h3
          data-es="Seleccionamos las obras"
          data-en="We select the artworks"></h3>
        <p
          data-es="Curamos piezas que dialogan con el espacio y refuerzan su identidad."
          data-en="We curate pieces that dialogue with the space and reinforce its identity."></p>
      </div>

      <div class="step">
        <span>03</span>
        <h3
          data-es="Instalamos y acompañamos"
          data-en="We install and support"></h3>
        <p
          data-es="Nos ocupamos de la instalación y el seguimiento del proyecto."
          data-en="We handle installation and project follow-up."></p>
      </div>

    </div>
  </div>

  <!-- PROPUESTA DE VALOR -->
  <div class="value-proposition">

    <h2
      data-es="Más que decoración"
      data-en="More than decoration"></h2>

    <ul>
      <li
        data-es="Refuerza la identidad del espacio"
        data-en="Strengthens the identity of the space"></li>
      <li
        data-es="Mejora la experiencia del cliente"
        data-en="Enhances the customer experience"></li>
      <li
        data-es="Aporta valor de marca al negocio"
        data-en="Adds brand value to the business"></li>
    </ul>

  </div>

</section>

<!-- =========================
FINE ART (SIN CAMBIOS)
========================= -->
<section id="fineart" class="section">
  <!-- CONTENIDO EXACTAMENTE IGUAL AL TUYO -->
  <!-- NO MODIFICADO -->
</section>

<!-- =========================
CONTACTO (SIN CAMBIOS)
========================= -->
<section id="contact" class="section contact">
  <!-- CONTENIDO EXACTAMENTE IGUAL AL TUYO -->
  <!-- NO MODIFICADO -->
</section>

<script>
/* NAV */
document.querySelectorAll('.nav-menu a').forEach(link => {
  link.onclick = () => {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(link.dataset.section).classList.add('active');
    window.scrollTo(0,0);
  };
});

/* LANGUAGE */
function setLanguage(lang) {
  document.querySelectorAll('[data-es]').forEach(el => {
    el.textContent = el.dataset[lang];
  });
}
document.querySelectorAll('.lang').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.lang').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setLanguage(btn.dataset.lang);
  };
});
setLanguage('es');

/* SLIDER */
const slides = document.querySelectorAll('.hero-slider img');
let i = 0;
setInterval(() => {
  slides[i].classList.remove('active');
  i = (i + 1) % slides.length;
  slides[i].classList.add('active');
}, 2500);
</script>

</body>
</html>

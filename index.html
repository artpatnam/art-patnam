<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Art Patnam | Arte para negocios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- GOOGLE FONTS -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="logo">ART PATNAM</div>

  <nav class="nav-menu">
    <a data-section="home">Inicio</a>
    <a data-section="fineart">Arte</a>
    <a data-section="contact">Contacto</a>
  </nav>

  <div class="lang-switch">
    <button class="lang active" data-lang="es">ES</button>
    <button class="lang" data-lang="en">EN</button>
  </div>
</header>

<!-- =========================
HOME
========================= -->
<section id="home" class="section active hero">
  <div class="hero-inner">

    <div class="hero-text hero-text-elegant">
      <span class="hero-eyebrow"
        data-es="Arte contemporáneo para espacios profesionales"
        data-en="Contemporary art for professional spaces"></span>

      <h1
        data-es="Convierte tu negocio en una experiencia que se recuerda"
        data-en="Turn your business into an experience people remember"></h1>

      <p class="hero-lead"
        data-es="Seleccionamos obras de arte que transforman la percepción de restaurantes, hoteles, clínicas y espacios de bienestar, reforzando la identidad del entorno y el valor de marca."
        data-en="We curate artworks that transform the perception of restaurants, hotels, clinics and wellness spaces, strengthening identity and brand value."></p>

      <p class="hero-secondary"
        data-es="Cada pieza está elegida para dialogar con el espacio, generar emociones positivas y mejorar la experiencia de clientes, pacientes y visitantes."
        data-en="Each piece is selected to dialogue with the space, evoke positive emotions and enhance the experience of clients, patients and visitors."></p>
    </div>

    <div class="hero-slider">
      <img src="img/anti-ism.jpg" class="active" alt="">
      <img src="img/silver-eruption.jpg" alt="">
      <img src="img/paisaje.jpg" alt="">
      <img src="img/paisaje-abstracto.jpg" alt="">
      <img src="img/i-journey.jpg" alt="">
    </div>

  </div>
</section>

<!-- =========================
FINE ART
========================= -->
<section id="fineart" class="section">

  <h2
    data-es="Arte seleccionado para espacios comerciales"
    data-en="Curated art for business spaces"></h2>

  <div class="filters-elegant">
    <span class="filter active" data-filter="all" data-es="Todos los espacios" data-en="All spaces">Todos los espacios</span>
    <span class="filter" data-filter="restaurant" data-es="Restaurantes" data-en="Restaurants">Restaurantes</span>
    <span class="filter" data-filter="hotel" data-es="Hoteles" data-en="Hotels">Hoteles</span>
    <span class="filter" data-filter="wellness" data-es="Wellness" data-en="Wellness">Wellness</span>
    <span class="filter" data-filter="clinic" data-es="Clínicas" data-en="Clinics">Clínicas</span>
    <span class="filter" data-filter="healthcare" data-es="Centros de salud" data-en="Healthcare centers">Centros de salud</span>
  </div>

  <div class="gallery">

    <article class="artwork" data-category="restaurant hotel">
      <img src="img/anti-ism.jpg" alt="">
      <h3>Anti‑ism</h3>
      <p data-es="Aporta carácter y personalidad a restaurantes y hoteles."
         data-en="Adds character and personality to restaurants and hotels."></p>
    </article>

    <article class="artwork" data-category="wellness office">
      <img src="img/silver-eruption.jpg" alt="">
      <h3>Silver Eruption</h3>
      <p data-es="Elegancia serena para oficinas y espacios de bienestar."
         data-en="Calm elegance for offices and wellness spaces."></p>
    </article>

    <article class="artwork" data-category="hotel healthcare">
      <img src="img/paisaje.jpg" alt="">
      <h3>Paisaje</h3>
      <p data-es="Crea ambientes cálidos y acogedores para clientes."
         data-en="Creates warm and welcoming environments for clients."></p>
    </article>

    <article class="artwork" data-category="clinic healthcare">
      <img src="img/paisaje-abstracto.jpg" alt="">
      <h3>Paisaje abstracto</h3>
      <p data-es="Equilibra y armoniza espacios clínicos y profesionales."
         data-en="Balances clinical and professional spaces."></p>
    </article>

    <article class="artwork" data-category="hotel wellness">
      <img src="img/i-journey.jpg" alt="">
      <h3>I Journey</h3>
      <p data-es="Eleva la percepción del negocio en espacios premium."
         data-en="Elevates business perception in premium spaces."></p>
    </article>

  </div>
</section>

<!-- =========================
CONTACTO (MISMO CONTENIDO / DESKTOP REORDENADO)
========================= -->
<section id="contact" class="section contact">

  <div class="contact-inner">

    <div class="contact-text">
      <span class="contact-eyebrow"
        data-es="Contacto profesional"
        data-en="Professional contact"></span>

      <h2
        data-es="Cuéntanos tu espacio"
        data-en="Tell us about your space"></h2>

      <p
        data-es="Trabajamos cada proyecto de forma personalizada para recomendar obras que encajen con el carácter del espacio, el tipo de negocio y la experiencia que deseas ofrecer."
        data-en="We approach every project individually to recommend artworks that fit the character of the space, the type of business and the experience you want to offer."></p>

      <p
        data-es="Rellena el formulario y nos pondremos en contacto contigo para asesorarte sin compromiso."
        data-en="Fill in the form and we will contact you to advise you with no obligation."></p>
    </div>

    <form class="contact-form"
      action="https://formspree.io/f/mnjnvbky"
      method="POST">

      <div class="form-group">
        <label data-es="Nombre" data-en="Name"></label>
        <input type="text" name="name" required>
      </div>

      <div class="form-group">
        <label data-es="Email" data-en="Email"></label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label data-es="Teléfono" data-en="Phone"></label>
        <input type="tel" name="phone">
      </div>

      <div class="form-group">
        <label data-es="Describe tu espacio" data-en="Describe your space"></label>
        <textarea name="space" rows="4"></textarea>
      </div>

      <div class="form-group">
        <label data-es="¿Qué tipo de obras te interesan?" data-en="What type of artworks are you interested in?"></label>
        <textarea name="art_interest" rows="4"></textarea>
      </div>

      <button type="submit"
        data-es="Enviar consulta"
        data-en="Send enquiry"></button>

    </form>

  </div>
</section>

<script>
/* NAV */
document.querySelectorAll('.nav-menu a').forEach(link => {
  link.onclick = () => {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(link.dataset.section).classList.add('active');
  };
});

/* LANGUAGE */
function setLanguage(lang) {
  document.querySelectorAll('[data-es]').forEach(el => {
    el.textContent = el.dataset[lang];
  });
}
document.querySelectorAll('.lang').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.lang').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setLanguage(btn.dataset.lang);
  };
});
setLanguage('es');

/* SLIDER */
const slides = document.querySelectorAll('.hero-slider img');
let i = 0;
setInterval(() => {
  slides[i].classList.remove('active');
  i = (i + 1) % slides.length;
  slides[i].classList.add('active');
}, 2500);

/* FILTROS */
const filters = document.querySelectorAll('.filter');
const artworks = document.querySelectorAll('.artwork');
filters.forEach(f => {
  f.onclick = () => {
    filters.forEach(b => b.classList.remove('active'));
    f.classList.add('active');
    const filter = f.dataset.filter;
    artworks.forEach(a => {
      a.style.display =
        (filter === 'all' || a.dataset.category.includes(filter))
        ? 'block'
        : 'none';
    });
  };
});
</script>

</body>
</html>

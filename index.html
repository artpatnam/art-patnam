<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Art Patnam | Art for Business Spaces</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- GOOGLE FONTS -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap">

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- =========================
LANGUAGE SELECTOR
========================= -->
<div id="language-modal" class="language-modal">
  <div class="language-box">
    <p>Select your language</p>
    <button data-lang="en">English</button>
    <button data-lang="es">Español</button>
  </div>
</div>

<!-- =========================
HEADER
========================= -->
<header>
  <div class="logo">ART PATNAM</div>

  <button class="menu-toggle" aria-label="Menu">☰</button>

  <nav class="nav-menu">
    <a data-section="home" data-en="Home" data-es="Inicio">Home</a>
    <a data-section="fineart" data-en="Fine Art" data-es="Arte">Fine Art</a>
    <a data-section="contact" data-en="Contact" data-es="Contacto">Contact</a>
  </nav>
</header>

<!-- =========================
HOME / HERO
========================= -->
<section id="home" class="section hero active">
  <div class="hero-inner">

    <div class="hero-text">
      <h1
        data-en="Transform your business space into an experience"
        data-es="Convierte tu negocio en una experiencia que atrae y fideliza">
      </h1>

      <p
        data-en="Carefully selected art that enhances your brand, improves customer perception and elevates the value of your space."
        data-es="Arte cuidadosamente seleccionado que refuerza tu marca, mejora la percepción de tus clientes y revaloriza tu espacio.">
      </p>
    </div>

    <!-- HERO SLIDER -->
    <div class="hero-slider">
      <img src="img/anti-ism.jpg" alt="Anti-ism" class="active">
      <img src="img/silver-eruption.jpg" alt="Silver Eruption">
      <img src="img/paisaje.jpg" alt="Paisaje">
      <img src="img/paisaje-abstracto.jpg" alt="Paisaje abstracto">
      <img src="img/i-journey.jpg" alt="I Journey">
    </div>

  </div>
</section>

<!-- =========================
FINE ART
========================= -->
<section id="fineart" class="section">

  <h2
    data-en="Fine Art for Business Spaces"
    data-es="Arte para espacios comerciales">
  </h2>

  <p class="section-desc"
     data-en="A curated selection of artworks designed to enhance restaurants, offices, clinics and wellness spaces."
     data-es="Una selección de obras pensadas para mejorar restaurantes, oficinas, clínicas y espacios de bienestar.">
  </p>

  <!-- FILTERS -->
  <div class="filters">
    <button class="filter active" data-filter="all"
      data-en="All spaces" data-es="Todos">All</button>
    <button class="filter" data-filter="restaurant"
      data-en="Restaurants" data-es="Restaurantes">Restaurants</button>
    <button class="filter" data-filter="office"
      data-en="Offices" data-es="Oficinas">Offices</button>
    <button class="filter" data-filter="clinic"
      data-en="Clinics" data-es="Clínicas">Clinics</button>
    <button class="filter" data-filter="wellness"
      data-en="Wellness & Beauty" data-es="Wellness y Belleza">Wellness</button>
  </div>

  <!-- GALLERY -->
  <div class="gallery">

    <article class="artwork" data-space="restaurant office">
      <div class="art-image">
        <img src="img/anti-ism.jpg" alt="Anti-ism">
      </div>
      <h3>Anti-ism</h3>
      <span class="use" data-en="Restaurants & offices" data-es="Restaurantes y oficinas"></span>
      <p data-en="A bold piece that adds character and identity."
         data-es="Una obra con carácter que aporta identidad al espacio."></p>
    </article>

    <article class="artwork" data-space="office wellness">
      <div class="art-image">
        <img src="img/silver-eruption.jpg" alt="Silver Eruption">
      </div>
      <h3>Silver Eruption</h3>
      <span class="use" data-en="Offices & wellness" data-es="Oficinas y wellness"></span>
      <p data-en="Elegant and calm, ideal for professional environments."
         data-es="Elegante y serena, ideal para entornos profesionales."></p>
    </article>

    <article class="artwork" data-space="restaurant office">
      <div class="art-image">
        <img src="img/paisaje.jpg" alt="Paisaje">
      </div>
      <h3>Paisaje</h3>
      <span class="use" data-en="Restaurants & offices" data-es="Restaurantes y oficinas"></span>
      <p data-en="Warm and welcoming atmosphere."
         data-es="Crea una atmósfera cálida y acogedora."></p>
    </article>

    <article class="artwork" data-space="clinic office restaurant wellness">
      <div class="art-image">
        <img src="img/paisaje-abstracto.jpg" alt="Paisaje abstracto">
      </div>
      <h3>Paisaje abstracto</h3>
      <span class="use" data-en="All business spaces" data-es="Todos los espacios"></span>
      <p data-en="Versatile artwork that adapts to any environment."
         data-es="Obra versátil que se adapta a cualquier entorno."></p>
    </article>

    <article class="artwork" data-space="restaurant office clinic wellness">
      <div class="art-image">
        <img src="img/i-journey.jpg" alt="I Journey">
      </div>
      <h3>I Journey</h3>
      <span class="use" data-en="All business spaces" data-es="Todos los espacios"></span>
      <p data-en="A universal piece that elevates any space."
         data-es="Una obra universal que eleva cualquier espacio."></p>
    </article>

  </div>
</section>

<!-- =========================
CONTACT
========================= -->
<section id="contact" class="section contact">
  <h2 data-en="Contact us" data-es="Contacto"></h2>
  <p data-en="Tell us about your space"
     data-es="Cuéntanos cómo es tu espacio"></p>

  <form action="https://formspree.io/f/mnjnvbky" method="POST">
    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="message" placeholder="Project details"></textarea>
    <button type="submit" data-en="Send message" data-es="Enviar mensaje"></button>
  </form>
</section>

<footer class="visually-hidden">© 2026 Art Patnam</footer>

<!-- =========================
SCRIPTS
========================= -->
<script>
/* LANGUAGE */
const modal = document.getElementById('language-modal');
if (localStorage.getItem('lang')) {
  modal.style.display = 'none';
  setLanguage(localStorage.getItem('lang'));
}
document.querySelectorAll('[data-lang]').forEach(btn => {
  btn.onclick = () => {
    localStorage.setItem('lang', btn.dataset.lang);
    modal.style.display = 'none';
    setLanguage(btn.dataset.lang);
  };
});
function setLanguage(lang) {
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = el.dataset[lang];
  });
}

/* MENU */
document.querySelector('.menu-toggle').onclick = () => {
  document.querySelector('.nav-menu').classList.toggle('open');
};

/* NAV */
document.querySelectorAll('.nav-menu a').forEach(link => {
  link.onclick = () => {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(link.dataset.section).classList.add('active');
    document.querySelector('.nav-menu').classList.remove('open');
  };
});

/* FILTERS */
document.querySelectorAll('.filter').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('.artwork').forEach(a => {
      a.style.display = (f === 'all' || a.dataset.space.includes(f)) ? 'block' : 'none';
    });
  };
});

/* HERO SLIDER */
const slides = document.querySelectorAll('.hero-slider img');
let current = 0;

setInterval(() => {
  slides[current].classList.remove('active');
  current = (current + 1) % slides.length;
  slides[current].classList.add('active');
}, 2000);
</script>

</body>
</html>
